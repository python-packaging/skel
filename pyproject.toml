[project]
name = "skel"
version = "0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "build >= 1",
  "checkdeps == 0.9.0",
  "coverage == 7.4.3",
  "mypy == 1.8.0",
  "ruff == 0.8.0",
  "volatile == 2.1.0",
  "wheel == 0.42.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I", # isort
]

[tool.ruff.lint.isort]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "PLR2004", # Magic value used instead of constant (only in tests)
]
